name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Preflight
        run: |
          P=F1OOB.xcodeproj/project.pbxproj
          echo "sync=$(grep -c 'PBXFileSystemSynchronizedRootGroup' "$P" || true)"
          echo "phases=$(grep -c 'PBXSourcesBuildPhase' "$P" || true)"
          echo "--- main.m ---"
          find . -name 'main.m' -not -path './build/*'
          echo "--- IOKitLib.h in SDK ---"
          find "$(xcrun --sdk iphoneos --show-sdk-path)" -name 'IOKitLib.h' 2>/dev/null | head -n3
          echo "--- plist ---"
          grep -E 'UIDeviceFamily|MinimumOSVersion|CFBundleExecutable' Sources/Info.plist || true

      - name: Patch project
        run: python3 scripts/patch_project.py

      - name: Verify project
        run: |
          P=F1OOB.xcodeproj/project.pbxproj
          plutil -lint "$P" || exit 1
          U=$(grep -c 'UIKit' "$P" || true)
          SRC=$(grep -c 'IOKitTrapShim.m in Sources' "$P" || true)
          REF=$(grep -c 'path = IOKitTrapShim.m' "$P" || true)
          SYNC=$(grep -c 'PBXFileSystemSynchronizedRootGroup' "$P" || true)
          echo "UIKit=$U src=$SRC ref=$REF sync=$SYNC"
          [ "$U" -ge 2 ] || { echo "FAIL: UIKit flags"; exit 1; }
          [ -f Sources/IOKitTrapShim.m ] || { echo "FAIL: shim absent"; exit 1; }
          [ "$REF" -ge 1 ] || [ "$SYNC" -ge 1 ] || { echo "FAIL: no file reference"; exit 1; }
          [ "$SRC" -ge 1 ] || [ "$SYNC" -ge 1 ] || { echo "FAIL: shim not compiled"; exit 1; }
          echo OK

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project F1OOB.xcodeproj \
            -target F1OOB \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP="$(find build/Release-iphoneos -maxdepth 1 -name '*.app' | head -n1)"
          if [ -z "$APP" ]; then echo "no .app"; find build -name '*.app'; exit 1; fi
          EXEC="$(basename "$APP" .app)"
          mkdir -p Payload
          cp -R "$APP" Payload/
          brew install ldid >/dev/null
          if [ -f F1OOB.entitlements ]; then
            codesign -s - --force --entitlements F1OOB.entitlements \
              --generate-entitlement-der "Payload/$EXEC.app/$EXEC" 2>/dev/null || \
            ldid -S F1OOB.entitlements "Payload/$EXEC.app/$EXEC"
          else
            ldid -S "Payload/$EXEC.app/$EXEC"
          fi
          zip -qry F1OOB.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: F1OOB-ipa
          path: F1OOB.ipa
          if-no-files-found: error
