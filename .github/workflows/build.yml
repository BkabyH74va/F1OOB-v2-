name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Preflight
        run: |
          echo "image: ${ImageOS:-?} ${ImageVersion:-?}"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "sdk: $SDK"
          echo "--- IOKitLib.h in SDK ---"
          find "$SDK" -name 'IOKitLib.h' 2>/dev/null | head -n5
          echo "--- plist keys ---"
          grep -E 'UIDeviceFamily|MinimumOSVersion|CFBundleExecutable|CFBundleIdentifier' \
            Sources/Info.plist 2>/dev/null || echo "Info.plist unreadable"

      - name: Patch project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("F1OOB.xcodeproj/project.pbxproj")
          s = p.read_text()
          LINE = ('\t\t\t\tOTHER_LDFLAGS = ("-framework", "UIKit", "-framework", '
                  '"Foundation", "-framework", "IOKit", '
                  '"-Wl,-undefined,dynamic_lookup");\n')
          if '"UIKit"' in s:
              print("already has UIKit")
              raise SystemExit(0)
          s, n = re.subn(r"\t+OTHER_LDFLAGS = \([^)]*\);\n", LINE, s)
          if n == 0:
              s = re.sub(r"(buildSettings = \{\n)", r"\1" + LINE, s, count=2)
              print("inserted into both buildSettings blocks")
          else:
              print(f"replaced {n} existing OTHER_LDFLAGS line(s)")
          p.write_text(s)
          PY

      - name: Verify project
        run: |
          set -euo pipefail
          P=F1OOB.xcodeproj/project.pbxproj
          plutil -lint "$P"
          U=$(grep -c 'UIKit' "$P" || true)
          D=$(grep -c 'dynamic_lookup' "$P" || true)
          S=$(grep -c 'IOKitTrapShim.m in Sources' "$P" || true)
          echo "UIKit=$U dynamic_lookup=$D shim=$S"
          [ "$U" -ge 2 ] || { echo "FAIL: UIKit missing from a config"; exit 1; }
          [ "$D" -ge 2 ] || { echo "FAIL: dynamic_lookup missing from a config"; exit 1; }
          [ "$S" -ge 1 ] || { echo "FAIL: trap shim not in Sources phase"; exit 1; }

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project F1OOB.xcodeproj \
            -target F1OOB \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find build/Release-iphoneos -maxdepth 1 -name '*.app' | head -n1)"
          if [ -z "$APP" ]; then
            echo "no .app produced; showing what did land:"
            find build -name '*.app' 2>/dev/null
            exit 1
          fi
          echo "app: $APP"

          EXEC="$(basename "$APP" .app)"
          mkdir -p Payload
          cp -R "$APP" Payload/

          brew install ldid >/dev/null
          if [ -f F1OOB.entitlements ]; then
            codesign -s - --force --entitlements F1OOB.entitlements \
              --generate-entitlement-der "Payload/$EXEC.app/$EXEC" 2>/dev/null || \
            ldid -S F1OOB.entitlements "Payload/$EXEC.app/$EXEC"
          else
            echo "F1OOB.entitlements missing; ad-hoc signing only"
            ldid -S "Payload/$EXEC.app/$EXEC"
          fi

          zip -qry F1OOB.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: F1OOB-ipa
          path: F1OOB.ipa
          if-no-files-found: error
