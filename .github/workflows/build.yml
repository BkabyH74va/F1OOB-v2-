name: Build IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build
        run: |
          xcodebuild -project F1OOB.xcodeproj -target F1OOB \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -name '*.app' -maxdepth 1)
          mkdir -p Payload && cp -R "$APP" Payload/
          brew install ldid
          ldid -S F1OOB.entitlements "Payload/$(basename "$APP")/F1OOB"
          zip -qr F1OOB.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: F1OOB-ipa
          path: F1OOB.ipa
