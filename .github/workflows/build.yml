name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Preflight
        run: |
          set -uo pipefail
          P=F1OOB.xcodeproj/project.pbxproj
          echo "--- project layout ---"
          grep -c 'PBXFileSystemSynchronizedRootGroup' "$P" || true
          grep -c 'PBXSourcesBuildPhase' "$P" || true
          grep -c 'IOKitTrapShim.m' "$P" || true
          echo "--- shim files on disk ---"
          ls -l Sources/IOKitTrapShim.* 2>/dev/null || echo "shim files missing"
          echo "--- main.m ---"
          ls -l Sources/main.m 2>/dev/null || echo "main.m missing"

      - name: Patch project
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("F1OOB.xcodeproj/project.pbxproj")
          s = p.read_text()

          LINE = ('\t\t\t\tOTHER_LDFLAGS = ("-framework", "UIKit", "-framework", '
                  '"Foundation", "-framework", "IOKit", '
                  '"-Wl,-undefined,dynamic_lookup");\n')
          if '"UIKit"' not in s:
              s, n = re.subn(r"\t+OTHER_LDFLAGS = \([^)]*\);\n", LINE, s)
              if n == 0:
                  s = re.sub(r"(buildSettings = \{\n)", r"\1" + LINE, s, count=2)
              print("link flags set")

          if "PBXFileSystemSynchronizedRootGroup" in s:
              print("layout: synchronized folder - no wiring needed")
          elif "IOKitTrapShim.m in Sources" in s:
              print("shim already wired")
          else:
              BF  = "A1B2C3D4A1B2C3D4A1B2C3D4"
              FRM = "A1B2C3D4A1B2C3D4A1B2C3D5"
              FRH = "A1B2C3D4A1B2C3D4A1B2C3D6"
              if FRM not in s:
                  s = re.sub(r"(begin PBXBuildFile section\n)",
                      r"\1\t\t" + BF + " /* IOKitTrapShim.m in Sources */ = {isa = PBXBuildFile; "
                      "fileRef = " + FRM + " /* IOKitTrapShim.m */; };\n", s, count=1)
                  s = re.sub(r"(begin PBXFileReference section\n)",
                      r"\1\t\t" + FRM + ' /* IOKitTrapShim.m */ = {isa = PBXFileReference; '
                      'lastKnownFileType = sourcecode.c.objc; path = IOKitTrapShim.m; '
                      'sourceTree = "<group>"; };\n'
                      "\t\t" + FRH + ' /* IOKitTrapShim.h */ = {isa = PBXFileReference; '
                      'lastKnownFileType = sourcecode.c.h; path = IOKitTrapShim.h; '
                      'sourceTree = "<group>"; };\n', s, count=1)
                  print("added file references")

              m = re.search(r"[ \t]*[A-Z0-9]{24} /\* main\.m \*/,\n", s)
              if m:
                  i = s.rfind("children = (", 0, m.end())
                  if i != -1:
                      j = s.index("\n", i) + 1
                      s = (s[:j] + "\t\t\t\t" + FRM + " /* IOKitTrapShim.m */,\n"
                           "\t\t\t\t" + FRH + " /* IOKitTrapShim.h */,\n" + s[j:])
                      print("added to group")

              bm = re.search(r"([A-Z0-9]{24}) /\* main\.m in Sources \*/", s)
              if bm:
                  k = s.find(bm.group(1))
                  i = s.rfind("files = (", 0, k)
                  if i != -1:
                      j = s.index("\n", i) + 1
                      s = (s[:j] + "\t\t\t\t" + BF
                           + " /* IOKitTrapShim.m in Sources */,\n" + s[j:])
                      print("added to Sources phase")

          p.write_text(s)
          PY

      - name: Verify project
        run: |
          set -uo pipefail
          P=F1OOB.xcodeproj/project.pbxproj
          plutil -lint "$P" || exit 1
          U=$(grep -c 'UIKit' "$P" || true)
          D=$(grep -c 'dynamic_lookup' "$P" || true)
          SYNC=$(grep -c 'PBXFileSystemSynchronizedRootGroup' "$P" || true)
          SRC=$(grep -c 'IOKitTrapShim.m in Sources' "$P" || true)
          [ -f Sources/IOKitTrapShim.m ] && SHIM=1 || SHIM=0
          echo "UIKit=$U dynamic_lookup=$D sync=$SYNC src=$SRC shimfile=$SHIM"
          [ "$U" -ge 2 ] || { echo "FAIL: UIKit missing from a config"; exit 1; }
          [ "$D" -ge 2 ] || { echo "FAIL: dynamic_lookup missing from a config"; exit 1; }
          [ "$SHIM" -eq 1 ] || { echo "FAIL: Sources/IOKitTrapShim.m does not exist"; exit 1; }
          if [ "$SRC" -ge 1 ] || [ "$SYNC" -ge 1 ]; then
            echo "shim will compile"
          else
            echo "FAIL: no Sources entry and no synchronized folder"
            exit 1
          fi

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project F1OOB.xcodeproj \
            -target F1OOB \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find build/Release-iphoneos -maxdepth 1 -name '*.app' | head -n1)"
          if [ -z "$APP" ]; then
            echo "no .app produced; showing what did land:"
            find build -name '*.app' 2>/dev/null
            exit 1
          fi
          echo "app: $APP"

          EXEC="$(basename "$APP" .app)"
          mkdir -p Payload
          cp -R "$APP" Payload/

          brew install ldid >/dev/null
          if [ -f F1OOB.entitlements ]; then
            codesign -s - --force --entitlements F1OOB.entitlements \
              --generate-entitlement-der "Payload/$EXEC.app/$EXEC" 2>/dev/null || \
            ldid -S F1OOB.entitlements "Payload/$EXEC.app/$EXEC"
          else
            echo "F1OOB.entitlements missing; ad-hoc signing only"
            ldid -S "Payload/$EXEC.app/$EXEC"
          fi

          zip -qry F1OOB.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: F1OOB-ipa
          path: F1OOB.ipa
          if-no-files-found: error
