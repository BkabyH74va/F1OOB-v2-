name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls -1 /Applications | grep -i '^Xcode' || true
          XCODE="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Preflight
        run: |
          echo "image: ${ImageOS:-?} ${ImageVersion:-?}"
          echo "arch: $(uname -m)"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "sdk: $SDK"
          echo "--- IOKit framework in SDK ---"
          ls "$SDK/System/Library/Frameworks/IOKit.framework" 2>/dev/null \
            || echo "NO IOKit.framework in SDK"
          echo "--- IOKitLib.h anywhere in SDK ---"
          find "$SDK" -name 'IOKitLib.h' 2>/dev/null | head -n5
          echo "--- vendored headers in repo ---"
          find . -name '*.h' -path '*IOKit*' 2>/dev/null | head -n20
          echo "--- sources ---"
          ls -1 Sources 2>/dev/null || echo "no Sources dir"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project F1OOB.xcodeproj \
            -target F1OOB \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$PWD/build" \
            OBJROOT="$PWD/build/obj" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find build/Release-iphoneos -maxdepth 1 -name '*.app' | head -n1)"
          if [ -z "$APP" ]; then
            echo "no .app produced; showing what did land:"
            find build -name '*.app' 2>/dev/null
            exit 1
          fi
          echo "app: $APP"

          EXEC="$(basename "$APP" .app)"
          mkdir -p Payload
          cp -R "$APP" Payload/

          brew install ldid >/dev/null
          if [ -f F1OOB.entitlements ]; then
            codesign -s - --force --entitlements F1OOB.entitlements \
              --generate-entitlement-der "Payload/$EXEC.app/$EXEC" 2>/dev/null || \
            ldid -S F1OOB.entitlements "Payload/$EXEC.app/$EXEC"
          else
            echo "F1OOB.entitlements missing; ad-hoc signing only"
            ldid -S "Payload/$EXEC.app/$EXEC"
          fi

          zip -qry F1OOB.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: F1OOB-ipa
          path: F1OOB.ipa
          if-no-files-found: error
